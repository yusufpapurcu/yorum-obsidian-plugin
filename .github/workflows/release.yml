# Push a tag equal to the version in manifest.json (e.g. 0.1.0, no "v") to publish a plugin release.
# Obsidian installs main.js, manifest.json and styles.css from the release whose tag matches that version.
name: Release plugin

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run plugin:release

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: obsidian-plugin/main.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            obsidian-plugin/main.js manifest.json obsidian-plugin/styles.css \
            --title "$GITHUB_REF_NAME" --generate-notes
