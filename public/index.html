<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yorum · talk with your notes</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">yorum<span>.</span></div>
      <div class="status" id="status"></div>
      <input id="search" class="search" type="search" placeholder="Search notes & comments" autocomplete="off" spellcheck="false" />
      <div id="search-results" class="search-results" hidden></div>
      <nav id="notes" class="notes"></nav>
    </aside>

    <main id="main">
      <p class="empty">Pick a note on the left.</p>
    </main>

    <aside id="panel" class="panel">
      <header class="panel-header">
        <h2>Comments</h2>
        <button type="button" id="ask-note" disabled>Ask about the whole note</button>
      </header>
      <div id="threads" class="threads">
        <p class="empty hint">Select text in the note and press “Ask about this”, or hover a paragraph and press +.</p>
      </div>
    </aside>

    <div id="selection-bar" class="selection-bar" hidden></div>

    <dialog id="inspector" class="inspector">
      <header>
        <h2>What the AI sees</h2>
        <button type="button" class="close" aria-label="Close">×</button>
      </header>
      <div class="inspector-body"></div>
    </dialog>

    <template id="note-template">
      <header class="note-header">
        <div class="note-toolbar">
          <span class="note-path"></span>
          <a class="open-obsidian">Open in Obsidian ↗</a>
        </div>
        <h1 class="note-title"></h1>
        <form class="intent">
          <label for="intent-input">Tell it what this note is for</label>
          <textarea
            id="intent-input"
            rows="2"
            placeholder="e.g. “I'm struggling to learn recursion. Quiz me and explain with tiny examples.”"
          ></textarea>
          <div class="intent-starters chips"></div>
          <div class="intent-actions">
            <span class="intent-state"></span>
            <button type="submit">Save</button>
          </div>
        </form>
      </header>
      <article class="doc"></article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
